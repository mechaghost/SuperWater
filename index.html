<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SuperWater</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Interactive procedural ocean"></canvas>
      <section class="hud" aria-label="Water controls">
        <div class="hud__header">
          <span class="hud__eyebrow">SuperWater</span>
          <h1>Procedural Ocean</h1>
        </div>
        <div class="preset-row" role="group" aria-label="Ocean presets">
          <button type="button" class="preset is-active" data-preset="reef">Reef</button>
          <button type="button" class="preset" data-preset="open">Choppy</button>
          <button type="button" class="preset" data-preset="storm">Storm</button>
          <button type="button" class="preset" data-preset="night">Night</button>
        </div>
        <label>
          <span>Wind</span>
          <input id="wind" type="range" min="-180" max="180" value="35" />
        </label>
        <label>
          <span>Wave height</span>
          <input id="height" type="range" min="0" max="3.2" step="0.01" value="1.95" />
        </label>
        <label>
          <span>Chop</span>
          <input id="chop" type="range" min="0.1" max="1.8" step="0.01" value="0.8" />
        </label>
        <label>
          <span>Foam</span>
          <input id="foam" type="range" min="0" max="1.75" step="0.01" value="0.92" />
        </label>
        <label>
          <span>Reflectivity</span>
          <input id="reflectivity" type="range" min="0" max="1.35" step="0.01" value="0.72" />
        </label>
      </section>
      <div class="vignette" aria-hidden="true"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
